name: 'Composer Outdated'
description: 'Looks for outdated composer dependencies and generates a markdown report for use in a pull request.'
author: 'Ed Wilde'
branding:
  color: green
  icon: arrow-up-circle
inputs:
  extra-arguments:
    description: 'Additional arguments passed to composer outdated command'
    required: false
  php-version:
    description: 'PHP version the project runs on, used when composer.json has no config.platform.php'
    required: false
  compatibility-packages:
    description: 'Space-separated packages whose installed major version updates must stay compatible with'
    required: false
    default: ''
outputs:
  composer_outdated:
    description: 'Markdown table of compatible updates, with incompatible packages collapsed below it'
  composer_outdated_abandoned:
    description: 'List of abandoned packages'
  composer_outdated_exit_code:
    description: 'Result of command (exit code) - use it to check the status'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    TARGET_PHP_VERSION: ${{ inputs.php-version }}
    COMPATIBILITY_PACKAGES: ${{ inputs.compatibility-packages }}
  args:
    - ${{ inputs.extra-arguments }}
